<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Cube AI Prototype</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#080b12;color:#eef;font-family:system-ui}#game{position:absolute;inset:0}#ui{position:absolute;left:12px;right:12px;bottom:12px;display:grid;gap:8px;pointer-events:none}.panel{background:#101725dd;border:1px solid #33415d;border-radius:14px;padding:10px;pointer-events:auto;backdrop-filter:blur(10px)}.row{display:flex;gap:7px;flex-wrap:wrap}input,button{font:inherit;border-radius:9px;border:1px solid #405070;background:#121b2c;color:#fff;padding:10px}input{min-width:0;flex:1}button{cursor:pointer}.small{font-size:12px;color:#aebbd3}#code{max-height:130px;overflow:auto;white-space:pre-wrap;font:11px monospace;background:#080c14;padding:8px;border-radius:8px}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:#101725dd;border:1px solid #33415d;padding:8px 10px;border-radius:10px}@media(min-width:800px){#ui{left:20px;right:auto;width:520px}}</style>
</head><body><div id="game"></div><div class="top"><div class="badge">MAGIC CUBE • AI PROGRAMMABLE OBJECT</div><div id="state" class="badge">READY</div></div>
<div id="ui"><div class="panel"><div class="row"><input id="key" type="password" placeholder="OpenTyphoon API key (เก็บเฉพาะในหน้านี้)"><input id="model" value="typhoon-v2.5-30b-a3b-instruct" aria-label="model"></div><div class="small">คีย์ไม่ถูกบันทึกลง repo หรือ localStorage • สำหรับ prototype เท่านั้น</div></div><form id="form" class="panel"><div class="row"><input id="prompt" value="สร้างลูกเวทมนตร์สีแดง 3 ลูกลอยรอบตัวฉัน"><button>สร้างใน Cube</button></div><div id="msg" class="small">WASD/ลูกศร = เดิน • ลากจอ = หมุนกล้อง</div><details><summary class="small">ดูโค้ดที่ Agent สร้าง</summary><pre id="code">// Cube ready</pre></details></form></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const host=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x080b12);scene.fog=new THREE.Fog(0x080b12,18,55);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(7,7,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;host.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xaac8ff,0x182010,2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,4);dl.castShadow=true;scene.add(dl);const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x17202b,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(60,60,0x41506a,0x263044);scene.add(grid);
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,5,10),new THREE.MeshStandardMaterial({color:0x507cff}));body.position.y=1.05;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),new THREE.MeshStandardMaterial({color:0xe0b18c}));head.position.y=2.05;player.add(head);const cube=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.42),new THREE.MeshStandardMaterial({color:0x8b5cff,emissive:0x351080,emissiveIntensity:2}));cube.position.set(.8,1.45,0);player.add(cube);const creations=new THREE.Group();scene.add(creations);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let yaw=.55,pitch=.42,drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(.15,Math.min(1.1,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);
const api={clear(){while(creations.children.length)creations.remove(creations.children[0])},sphere(x=0,y=1,z=-2,r=.4,color=0xff5533){const m=new THREE.Mesh(new THREE.SphereGeometry(Math.max(.08,Math.min(r,2)),20,14),new THREE.MeshStandardMaterial({color:Number(color),emissive:Number(color),emissiveIntensity:.45}));m.position.copy(player.position).add(new THREE.Vector3(clamp(x,-8,8),clamp(y,.1,8),clamp(z,-8,8)));m.castShadow=true;creations.add(m);return m},box(x=0,y=.5,z=-2,w=1,h=1,d=1,color=0x9a7655){const m=new THREE.Mesh(new THREE.BoxGeometry(clamp(w,.1,6),clamp(h,.1,6),clamp(d,.1,6)),new THREE.MeshStandardMaterial({color:Number(color)}));m.position.copy(player.position).add(new THREE.Vector3(clamp(x,-8,8),clamp(y,.1,8),clamp(z,-8,8)));m.castShadow=true;creations.add(m);return m},orbit(obj,r=2,speed=1,phase=0){obj.userData.orbit={r:clamp(r,.2,6),speed:clamp(speed,-5,5),phase:Number(phase)||0,y:obj.position.y-player.position.y};return obj}};function clamp(v,a,b){v=Number(v);return Number.isFinite(v)?Math.max(a,Math.min(b,v)):a}
function sanitize(s){return String(s).replace(/^```(?:javascript|js)?/i,'').replace(/```$/,'').trim()}function run(code){if(/\b(window|document|fetch|XMLHttpRequest|WebSocket|localStorage|sessionStorage|eval|Function|import|navigator)\b/.test(code))throw Error('โค้ดใช้ API ที่ Cube ไม่อนุญาต');const fn=new Function('cube','THREE','"use strict";\n'+code);fn(Object.freeze(api),undefined)}
const sys=`You are Cube Programmer in a 3D game. Return ONLY JavaScript, no markdown. The only global available is cube. Allowed API: cube.clear(); cube.sphere(x,y,z,r,colorNumber); cube.box(x,y,z,w,h,d,colorNumber); cube.orbit(object,radius,speed,phase). Build the player's requested object creatively using ONLY these calls. Coordinates are relative to player. Use numeric hex colors such as 0xff0000. Maximum 30 objects. Never use loops above 30 iterations, browser APIs, network, timers, eval, Function, imports, THREE, window or document.`;
const form=document.querySelector('#form'),msg=document.querySelector('#msg'),codeEl=document.querySelector('#code'),state=document.querySelector('#state');form.addEventListener('submit',async e=>{e.preventDefault();const key=document.querySelector('#key').value.trim(),prompt=document.querySelector('#prompt').value.trim(),model=document.querySelector('#model').value.trim();if(!key||!prompt)return msg.textContent='ใส่ API key และคำสั่งก่อน';state.textContent='AGENT THINKING';msg.textContent='Typhoon กำลังเขียนโค้ดลง Cube…';const t=performance.now();try{const res=await fetch('https://api.opentyphoon.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:sys},{role:'user',content:prompt}],temperature:.3,max_tokens:1200})});if(!res.ok)throw Error('API '+res.status+': '+await res.text());const data=await res.json();const code=sanitize(data.choices?.[0]?.message?.content||'');codeEl.textContent=code;state.textContent='EXECUTING';run(code);msg.textContent='สร้างสำเร็จใน '+((performance.now()-t)/1000).toFixed(2)+' วินาที';state.textContent='READY'}catch(err){state.textContent='ERROR';msg.textContent=err.message}});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),v=3.5*dt;let dx=0,dz=0;if(keys.w||keys.arrowup)dz-=v;if(keys.s||keys.arrowdown)dz+=v;if(keys.a||keys.arrowleft)dx-=v;if(keys.d||keys.arrowright)dx+=v;player.position.x+=dx;player.position.z+=dz;const t=performance.now()/1000;for(const o of creations.children){const q=o.userData.orbit;if(q){o.position.x=player.position.x+Math.cos(t*q.speed+q.phase)*q.r;o.position.z=player.position.z+Math.sin(t*q.speed+q.phase)*q.r;o.position.y=player.position.y+q.y}}const dist=9,cp=Math.cos(pitch);camera.position.set(player.position.x+Math.sin(yaw)*cp*dist,player.position.y+2+Math.sin(pitch)*dist,player.position.z+Math.cos(yaw)*cp*dist);camera.lookAt(player.position.x,1.2,player.position.z);cube.rotation.x+=dt;cube.rotation.y+=dt*1.6;renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
