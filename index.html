<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Magic Cube V4.0</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070a11;color:#eef;font-family:system-ui;touch-action:none}#game{position:absolute;inset:0}canvas{display:block;touch-action:none}#top{position:absolute;top:7px;left:7px;right:7px;display:flex;justify-content:space-between;pointer-events:none}.b{background:#101725dc;border:1px solid #35425d;border-radius:9px;padding:6px;font-size:11px}#panel{position:absolute;left:8px;right:8px;top:42px;background:#101725e8;border:1px solid #35425d;border-radius:12px;padding:7px;z-index:20}.r{display:flex;gap:5px;flex-wrap:wrap}input,button{box-sizing:border-box;min-height:36px;border:1px solid #405070;border-radius:8px;background:#121b2c;color:white;padding:6px;font:inherit}input{flex:1;min-width:105px}small{color:#aebbd3}details{font-size:10px}pre{max-height:70px;overflow:auto;white-space:pre-wrap;background:#070b13}.zone{position:absolute;bottom:0;height:62%;z-index:10;touch-action:none}.left{left:0;width:50%}.right{right:0;width:50%}#stick{position:fixed;width:120px;height:120px;border:2px solid #91a2c488;border-radius:50%;background:#17213799;display:none;transform:translate(-50%,-50%);pointer-events:none}#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:#aebbd3aa;transform:translate(-50%,-50%)}#action{position:fixed;right:22px;bottom:24px;width:90px;height:90px;border-radius:50%;z-index:30;background:#742d45dd;border:2px solid #ff9b8d;color:white;font-weight:800;font-size:16px;touch-action:none}#cross{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);font-size:25px;pointer-events:none;z-index:5}#moveLabel,#aimLabel{position:fixed;bottom:10px;font-size:11px;pointer-events:none;z-index:11;color:#b9c4d8}#moveLabel{left:12px}#aimLabel{right:122px}@media(min-width:800px){#panel{width:620px;right:auto}.zone,#action,#cross,#moveLabel,#aimLabel{display:none}}</style></head><body><div id="game"></div><div id="top"><div class="b">MAGIC CUBE V4.0 • TOUCH CONTROL</div><div id="state" class="b">READY</div></div><div id="panel"><div class="r"><input id="key" type="password" placeholder="OpenTyphoon API key"><input id="model" value="typhoon-v2.5-30b-a3b-instruct"></div><form id="form"><div class="r" style="margin-top:4px"><input id="prompt" value="ลูกพลังไฟ"><button id="go">แปลง</button><button id="clear" type="button">คืน Cube</button></div></form><small id="msg">แตะครึ่งซ้าย = joystick • ลากครึ่งขวา = หมุน/เล็ง • ACTION = ใช้</small><details><summary>Generated code</summary><pre id="code">// ready</pre></details></div><div id="left" class="zone left"></div><div id="right" class="zone right"></div><div id="stick"><div id="knob"></div></div><button id="action">ACTION</button><div id="cross">⊙</div><div id="moveLabel">MOVE</div><div id="aimLabel">AIM</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene(),host=document.querySelector('#game');scene.background=new THREE.Color(0x070a11);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbad4ff,0x151b12,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(7,12,6);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x18212d}));floor.rotation.x=-Math.PI/2;scene.add(floor,new THREE.GridHelper(70,70,0x42506a,0x283245));const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,5,10),new THREE.MeshStandardMaterial({color:0x456fff}));body.position.y=1.05;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),new THREE.MeshStandardMaterial({color:0xd8a985}));head.position.y=2.05;player.add(head);const cubeAnchor=new THREE.Group();cubeAnchor.position.set(.82,1.45,-.35);player.add(cubeAnchor);const baseCube=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.42),new THREE.MeshStandardMaterial({color:0x8557ff,emissive:0x351080,emissiveIntensity:2}));cubeAnchor.add(baseCube);let rootObj=new THREE.Group();cubeAnchor.add(rootObj);const targets=[];for(const p of [[0,1,-10],[-5,1,-14],[5,1,-16]]){const m=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.2,4,8),new THREE.MeshStandardMaterial({color:0xd92d45}));m.position.set(...p);m.userData.id=targets.length;scene.add(m);targets.push(m)}let hooks={},yaw=0,pitch=.2,mx=0,my=0,launched=false,vel=new THREE.Vector3(),lastPrompt='';function aim(){return new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)).normalize()}function reset(){rootObj.parent?.remove(rootObj);rootObj=new THREE.Group();cubeAnchor.add(rootObj);baseCube.visible=true;hooks={};launched=false}clear.onclick=reset;function worldFor(r){return {get forward(){return aim().clone().applyQuaternion(r.getWorldQuaternion(new THREE.Quaternion()).invert())},targets,hit(){}}}function norm(c){return c.replace(/^\s*(?:const|let|var)\s+(root|THREE|world)\s*=.*?;\s*/gm,'')}function compile(c,r){return new Function('THREE','root','world',`"use strict";${norm(c)};return {onUse:typeof onUse==='function'?onUse:null,update:typeof update==='function'?update:null}`)(THREE,r,worldFor(r))}function clean(s){return String(s).replace(/^```(?:javascript|js)?\s*/i,'').replace(/```\s*$/,'').trim()}async function ask(k,m,msgs){const r=await fetch('https://api.opentyphoon.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:m,messages:msgs,temperature:.1,max_tokens:5000})});if(!r.ok)throw Error('API '+r.status);return clean((await r.json()).choices?.[0]?.message?.content||'')}const sys=`Return ONLY JavaScript body. THREE, root, world exist. Transform the physical Cube by adding visible Three.js r180 objects under root immediately. Never redeclare root/THREE/world. world.forward is live player aim. Use THREE.Points for particles. Only define onUse for an explicitly requested special action.`;form.onsubmit=async e=>{e.preventDefault();const k=key.value.trim(),m=model.value.trim(),p=prompt.value.trim();if(!k||!p)return;lastPrompt=p;state.textContent='THINKING';try{const c=await ask(k,m,[{role:'system',content:sys},{role:'user',content:p}]);code.textContent=c;const nr=new THREE.Group();cubeAnchor.add(nr);const out=compile(c,nr);if(!nr.children.length)throw Error('no geometry');rootObj.parent?.remove(rootObj);rootObj=nr;baseCube.visible=false;hooks=out;launched=false;state.textContent='READY';msg.textContent='Cube แปลงแล้ว'}catch(e2){state.textContent='ERROR';msg.textContent=e2.message}};function fire(){if(hooks.onUse){hooks.onUse();msg.textContent='ACTION'}else if(!launched){const p=rootObj.getWorldPosition(new THREE.Vector3()),q=rootObj.getWorldQuaternion(new THREE.Quaternion());rootObj.parent?.remove(rootObj);scene.add(rootObj);rootObj.position.copy(p);rootObj.quaternion.copy(q);vel.copy(aim()).multiplyScalar(9);launched=true;msg.textContent='ACTION • ยิงแล้ว'}}action.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fire()});
const L=document.querySelector('#left'),R=document.querySelector('#right'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let lid=null,cx=0,cy=0;function lp(e){if(lid!==null)return;lid=e.pointerId;cx=e.clientX;cy=e.clientY;stick.style.left=cx+'px';stick.style.top=cy+'px';stick.style.display='block';L.setPointerCapture?.(lid);e.preventDefault()}function lm(e){if(e.pointerId!==lid)return;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),r=44;if(d>r){dx*=r/d;dy*=r/d}mx=dx/r;my=dy/r;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;e.preventDefault()}function le(e){if(e.pointerId!==lid)return;lid=null;mx=my=0;stick.style.display='none';knob.style.transform='translate(-50%,-50%)';e.preventDefault()}L.addEventListener('pointerdown',lp);L.addEventListener('pointermove',lm);L.addEventListener('pointerup',le);L.addEventListener('pointercancel',le);let rid=null,lx=0,ly=0;R.addEventListener('pointerdown',e=>{rid=e.pointerId;lx=e.clientX;ly=e.clientY;R.setPointerCapture?.(rid);e.preventDefault()});R.addEventListener('pointermove',e=>{if(e.pointerId!==rid)return;yaw-=(e.clientX-lx)*.009;pitch=Math.max(-.4,Math.min(.7,pitch-(e.clientY-ly)*.007));lx=e.clientX;ly=e.clientY;e.preventDefault()});R.addEventListener('pointerup',e=>{if(e.pointerId===rid)rid=null;e.preventDefault()});R.addEventListener('pointercancel',e=>{if(e.pointerId===rid)rid=null;e.preventDefault()});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),fw=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));player.position.addScaledVector(fw,-my*4*dt).addScaledVector(rt,mx*4*dt);player.rotation.y=yaw;cubeAnchor.rotation.x=-pitch*.7;if(hooks.update)try{hooks.update(dt,performance.now()/1000)}catch{}if(launched)rootObj.position.addScaledVector(vel,dt);camera.position.set(player.position.x+Math.sin(yaw)*8,player.position.y+4.6,player.position.z+Math.cos(yaw)*8);camera.lookAt(player.position.x+aim().x*4,1.5+aim().y*4,player.position.z+aim().z*4);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
