import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene(),host=document.querySelector('#game');scene.background=new THREE.Color(0x070a11);scene.fog=new THREE.Fog(0x070a11,20,65);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);host.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbad4ff,0x151b12,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(7,12,6);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x18212d}));floor.rotation.x=-Math.PI/2;scene.add(floor,new THREE.GridHelper(70,70,0x42506a,0x283245));const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,5,10),new THREE.MeshStandardMaterial({color:0x456fff}));body.position.y=1.05;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),new THREE.MeshStandardMaterial({color:0xd8a985}));head.position.y=2.05;player.add(head);const handCube=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.42),new THREE.MeshStandardMaterial({color:0x8557ff,emissive:0x351080,emissiveIntensity:2}));handCube.position.set(.82,1.45,0);player.add(handCube);const targets=[];for(const p of [[0,1,-10],[-5,1,-14],[5,1,-16]]){const m=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.2,4,8),new THREE.MeshStandardMaterial({color:0xd92d45,emissive:0x420008}));m.position.set(...p);m.userData.hp=100;m.userData.id=targets.length;scene.add(m);targets.push(m)}let workspace=new THREE.Group(),hooks={update:null,onUse:null},runtimeTime=0;scene.add(workspace);function clearSpace(){scene.remove(workspace);workspace=new THREE.Group();scene.add(workspace);hooks={update:null,onUse:null};runtimeTime=0}document.querySelector('#clear').onclick=clearSpace;
