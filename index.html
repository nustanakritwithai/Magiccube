import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene(),host=document.querySelector('#game');scene.background=new THREE.Color(0x070a11);scene.fog=new THREE.Fog(0x070a11,20,65);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);host.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbad4ff,0x151b12,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(7,12,6);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x18212d}));floor.rotation.x=-Math.PI/2;scene.add(floor,new THREE.GridHelper(70,70,0x42506a,0x283245));const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,5,10),new THREE.MeshStandardMaterial({color:0x456fff}));body.position.y=1.05;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),new THREE.MeshStandardMaterial({color:0xd8a985}));head.position.y=2.05;player.add(head);const handCube=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.42),new THREE.MeshStandardMaterial({color:0x8557ff,emissive:0x351080,emissiveIntensity:2}));handCube.position.set(.82,1.45,0);player.add(handCube);let workspace=new THREE.Group(),updater=null;scene.add(workspace);function clearSpace(){scene.remove(workspace);workspace=new THREE.Group();scene.add(workspace);updater=null}document.querySelector('#clear').onclick=clearSpace;const names=['Object3D','Group','Mesh','Points','Line','LineLoop','LineSegments','BufferGeometry','BufferAttribute','Float32BufferAttribute','BoxGeometry','SphereGeometry','PlaneGeometry','CircleGeometry','ConeGeometry','CylinderGeometry','TorusGeometry','TorusKnotGeometry','RingGeometry','DodecahedronGeometry','IcosahedronGeometry','OctahedronGeometry','TetrahedronGeometry','CapsuleGeometry','Shape','ShapeGeometry','ExtrudeGeometry','LatheGeometry','MeshBasicMaterial','MeshStandardMaterial','MeshPhysicalMaterial','MeshLambertMaterial','MeshPhongMaterial','PointsMaterial','LineBasicMaterial','Color','Vector2','Vector3','Vector4','Euler','Quaternion','Matrix3','Matrix4','MathUtils','AdditiveBlending','NormalBlending','DoubleSide','FrontSide','BackSide','DynamicDrawUsage'];const SafeTHREE={};for(const k of names)if(THREE[k]!==undefined)SafeTHREE[k]=THREE[k];Object.freeze(SafeTHREE);function guard(code){if(/\b(window|document|globalThis|fetch|XMLHttpRequest|WebSocket|localStorage|navigator|eval|Function|import\s*\(|setInterval|setTimeout|requestAnimationFrame)\b/.test(code))throw Error('โค้ดออกนอก Cube')}function build(code,commit=false){guard(code);const candidate=new THREE.Group();candidate.position.set(player.position.x,1.2,player.position.z-3);const fn=new Function('ctx','"use strict";const THREE=ctx.THREE,root=ctx.root;\n'+code+'\n;return typeof update==="function"?update:null;'),result=fn({THREE:SafeTHREE,root:candidate});let n=0;candidate.traverse(o=>{if(++n>100)throw Error('เกิน 100 objects');if(o.geometry?.attributes?.position?.count>16000)throw Error('geometry ใหญ่เกินไป')});const b=new THREE.Box3().setFromObject(candidate);if(!b.isEmpty()){const s=new THREE.Vector3();b.getSize(s);if(Math.max(s.x,s.y,s.z)>12)throw Error('ผลงานใหญ่เกินพื้นที่ Cube')}if(commit){clearSpace();workspace=candidate;scene.add(workspace);updater=typeof result==='function'?result:null}else scene.remove(candidate);return true}function sanitize(s){return String(s).replace(/^```(?:javascript|js)?\s*/i,'').replace(/```\s*$/,'').trim()}const sys=`Return ONLY executable JavaScript for a free 3D magical creation. THREE and root exist. Build from scratch under root. You choose geometry, raw vertices, materials, hierarchy, particles and update(dt,time). For BufferGeometry allocate arrays correctly and never write beyond attribute.count. Stay within 12m, <=100 objects, <=16000 vertices. No browser/network/timers/import/eval/Function/requestAnimationFrame/ShaderMaterial. No predefined spell helpers.`;async function ask(key,model,messages,max_tokens=2200){const r=await fetch('https://api.opentyphoon.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages,temperature:.25,max_tokens})});if(!r.ok)throw Error('API '+r.status+': '+await r.text());const d=await r.json();return sanitize(d.choices?.[0]?.message?.content||'')}const form=document.querySelector('#form'),msg=document.querySelector('#msg'),state=document.querySelector('#state'),codeEl=document.querySelector('#code'),go=document.querySelector('#go');form.addEventListener('submit',async e=>{e.preventDefault();const key=document.querySelector('#key').value.trim(),model=document.querySelector('#model').value.trim(),prompt=document.querySelector('#prompt').value.trim();if(!key||!prompt)return msg.textContent='ใส่ API key และคำสั่งก่อน';go.disabled=true;let sec=0,phase='GENERATING';const tick=setInterval(()=>msg.textContent=phase+' • '+(++sec)+'s',1000),t=performance.now();try{state.textContent='THINKING';let code=await ask(key,model,[{role:'system',content:sys},{role:'user',content:prompt}]);if(!code)throw Error('Agent ไม่ส่งโค้ดกลับมา');codeEl.textContent=code;let lastErr=null;for(let attempt=0;attempt<3;attempt++){phase=attempt===0?'VALIDATING':'REPAIR '+attempt;state.textContent=phase;try{build(code,false);lastErr=null;break}catch(err){lastErr=err;if(attempt===2)break;const repair=`The JavaScript you generated failed validation/execution. Repair it while preserving the user's requested visual/behavior. Return ONLY the complete corrected JavaScript, no markdown. Error: ${err.message}\n\nBROKEN CODE:\n${code}`;code=await ask(key,model,[{role:'system',content:sys},{role:'user',content:prompt},{role:'assistant',content:code},{role:'user',content:repair}],2600);codeEl.textContent=code}}
